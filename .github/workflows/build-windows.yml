name: Build Windows EXE

# 언제 이 빌드가 도는가
on:
  # 1) 수동 버튼 [Run workflow] — 누르면 드롭다운에서 stage 를 골라 빌드.
  #    ※ 버튼은 "기본 브랜치(main)"에 이 파일이 있어야 화면에 보인다(GitHub 규칙).
  workflow_dispatch:

  # 2) v로 시작하는 태그를 push 하면 → 자동 빌드 + Release
  #    (태그는 stage 에서 만들면 stage 코드 기준으로 빌드됨)
  push:
    tags:
      - "v*"

jobs:
  build:
    # 윈도우용 exe 는 반드시 윈도우에서 빌드해야 한다 → 윈도우 러너 사용
    runs-on: windows-latest

    # 태그 push 시 Release 를 만들려면 쓰기 권한이 필요하다
    permissions:
      contents: write

    steps:
      # 1. 저장소 코드를 러너로 내려받는다
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. 파이썬 설치 (윈도우용, tkinter 포함됨)
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 의존성 + PyInstaller 설치
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. exe 빌드
      #    --onefile   : 단일 exe 로 묶음
      #    --windowed  : 실행 시 검은 콘솔창이 안 뜨게(GUI 앱)
      #    --collect-all playwright : 브라우저 구동 드라이버까지 포함
      #    --collect-all certifi    : HTTPS 인증서 묶음 포함(allowlist https 읽기용)
      - name: EXE 빌드 (PyInstaller)
        run: >
          pyinstaller --onefile --windowed --name TKFDownloader
          --collect-all playwright
          --collect-all certifi
          --icon assets/sunshine.ico
          run.py

      # 5. 빌드된 exe 를 아티팩트로 업로드 (Actions 실행 페이지에서 zip 으로 다운로드)
      - name: EXE 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: TKFDownloader-windows
          path: dist/TKFDownloader.exe
          if-no-files-found: error

      # 6. (태그 push 일 때만) GitHub Release 를 만들고 exe 를 첨부
      - name: Release 생성 + EXE 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TKFDownloader.exe
